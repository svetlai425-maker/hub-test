<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f2f2f7; color: #222; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* Шапка */
  .header { text-align: center; padding: 28px 16px; border-radius: 20px;
            background: linear-gradient(135deg, #6a5acd, #8f6bd8); color: #fff; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px;
            background: rgba(255,255,255,.25); display: flex; align-items: center;
            justify-content: center; font-size: 38px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .shop-name { font-size: 22px; font-weight: bold; }
  .owner-name { opacity: .9; margin-top: 4px; }

  /* Кнопки-действия */
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .btn { display: block; text-align: center; padding: 14px; border-radius: 14px;
         text-decoration: none; font-weight: bold; font-size: 16px;
         background: #fff; color: #333; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .btn:active { transform: scale(.98); }

  /* Товары */
  .section-title { margin: 24px 4px 12px; font-size: 18px; }
  .card { background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card-photo { width: 100%; height: 170px; border-radius: 12px; background: #eee;
                display: flex; align-items: center; justify-content: center;
                font-size: 44px; overflow: hidden; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .card-name { font-weight: bold; margin-top: 10px; }
  .card-short { color: #777; font-size: 14px; margin-top: 2px; }
  .card-price { margin-top: 8px; font-size: 18px; font-weight: bold; }
  .card-price s { color: #aaa; font-weight: normal; font-size: 14px; margin-right: 8px; }
  .buy { display: block; text-align: center; margin-top: 10px; padding: 11px;
         border-radius: 12px; background: #6a5acd; color: #fff;
         text-decoration: none; font-weight: bold; }

  .error { color: #c00; padding: 20px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div id="status">Загружаю…</div>
</div>

<script>
// ====== ЕДИНСТВЕННОЕ МЕСТО ДЛЯ ПРАВОК ======
const SHEET_ID = "18xrdJA4zo8oFmb82tBSIt7AYnKWrDEFUXdknBXjrM8Q";
// ===========================================

const app = document.getElementById("app");
const status = document.getElementById("status");

// Получить лист и превратить в массив строк
async function getSheet(name) {
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
              "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(name);
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status + " (лист " + name + ")");
  const text = await r.text();
  return text.trim().split("\n").map(line => line.split(","));
}

// Кнопка-действие: рисуем ТОЛЬКО если ссылка заполнена
function actionBtn(label, url) {
  if (!url) return "";
  return '<a class="btn" href="' + url + '" target="_blank">' + label + '</a>';
}

async function build() {
  try {
    // --- Читаем оба листа одновременно ---
    const [setRows, prodRows] = await Promise.all([
      getSheet("Настройки"), getSheet("Товары")
    ]);

    // --- Настройки превращаем в объект {key: value} ---
    const S = {};
    for (let i = 1; i < setRows.length; i++) {
      if (setRows[i][0]) S[setRows[i][0].trim()] = (setRows[i][1] || "").trim();
    }

    document.title = S.shop_name || "Магазин";

    // --- Шапка: фото, а если его нет — первая буква имени ---
    let avatar;
    if (S.owner_photo) {
      avatar = '<div class="avatar"><img src="' + S.owner_photo + '" alt=""></div>';
    } else {
      const letter = (S.owner_name || "?").charAt(0).toUpperCase();
      avatar = '<div class="avatar">' + letter + '</div>';
    }

    const buttons =
      actionBtn("🛒 Каталог месяца", S.catalog_link) +
      actionBtn("🎯 Подобрать продукт", S.quiz_link) +
      actionBtn("💬 Написать мне", S.messenger_link);

    // --- Товары: только строки с active = да ---
    const header = prodRows[0];
    const col = n => header.indexOf(n);
    let cards = "";
    for (let i = 1; i < prodRows.length; i++) {
      const row = prodRows[i];
      const name = row[col("name")];
      const active = (row[col("active")] || "").toLowerCase();
      if (!name || active !== "да") continue;

      const photo = row[col("photo")];
      const price = row[col("price")];
      const priceOld = row[col("price_old")];
      const photoBlock = photo
        ? '<div class="card-photo"><img src="' + photo + '" alt=""></div>'
        : '<div class="card-photo">🛍️</div>';
      const oldPrice = priceOld
        ? '<s>' + priceOld + ' ₽</s>' : "";

      cards +=
        '<div class="card">' + photoBlock +
          '<div class="card-name">' + name + '</div>' +
          '<div class="card-short">' + (row[col("short")] || "") + '</div>' +
          '<div class="card-price">' + oldPrice + price + ' ₽</div>' +
          '<a class="buy" href="' + (row[col("link")] || "#") + '" target="_blank">Купить</a>' +
        '</div>';
    }

    status.remove();

    app.innerHTML =
      '<div class="header">' + avatar +
        '<div class="shop-name">' + (S.shop_name || "") + '</div>' +
        '<div class="owner-name">' + (S.owner_name || "") + '</div>' +
      '</div>' +
      '<div class="actions">' + buttons + '</div>' +
      (cards ? '<div class="section-title">Наши товары</div>' + cards : "");

  } catch (e) {
    status.innerHTML = '<span class="error">ОШИБКА: ' + e.message +
      '<br>Если «Failed to fetch» — проверьте доступ к таблице или откройте страницу не с диска, а из интернета.</span>';
  }
}

build();
</script>
</body>
</html>
